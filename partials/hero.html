<section class="hero">

    <div class="ui-layer">
        <!-- Fullscreen Cursor Crosshair Lines -->
        <div class="cursor-line-v"></div>
        <div class="cursor-line-h"></div>
        <div class="cursor-crosshair"></div>
        <div class="spiral-tooltip" id="spiral-tooltip">
            <div class="tooltip-square"></div>
            <div class="tooltip-text">FACE YOUR FEARS</div>
        </div>

        <!-- Huge Text -->
        <h1 class="title">
            <div class="line1">UNSEEN</div>
            <div class="line2">STUDIO</div>
        </h1>

        <!-- UI Utils Bar -->
        <div class="hero-ui-bar">
            <div class="logo">UNSEEN STUDIO</div>

            <div class="right-utils">
                <div class="coords">X : <span id="x-coord-hero">0</span> &nbsp; Y : <span id="y-coord-hero">0</span></div>
                <button class="menu-btn" id="hero-menu-btn" aria-label="Open Navigation Menu">[ MENU ]</button>
            </div>
        </div>

        <!-- Grid Overlays -->
        <div class="grid-vertical"></div>
        <div class="crosshair ch-left">
            <div class="v"></div>
            <div class="h"></div>
        </div>
        <div class="crosshair ch-right">
            <div class="v"></div>
            <div class="h"></div>
        </div>
    </div>
