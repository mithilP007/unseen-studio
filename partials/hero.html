<section class="hero">
    <!-- Background Content (Behind WebGL) -->

            <div class="small-logo"></div>
            <p>Award-winning motion, design and interactive<br>experiences that connect culture, technology,
                and<br>contemporary aesthetics.</p>

            <div class="right-utils">

                <button class="menu-btn">[ MENU ]</button>
            </div>
        </div>

        <div class="grid-vertical"></div>
        <div class="crosshair ch-left">
            <div class="v"></div>
            <div class="h"></div>
        </div>
